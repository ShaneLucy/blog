name: Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bunx prettier --check .

      - name: Lint
        run: bunx eslint .

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build
